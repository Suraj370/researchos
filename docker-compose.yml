services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos
      POSTGRES_DB: researchos
    ports:
      - "5432:5432"
    volumes:
      - researchos_postgres_data:/var/lib/postgresql/data

volumes:
  researchos_postgres_data:
